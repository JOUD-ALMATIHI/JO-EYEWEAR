<html>
<head>
    <title>JO EYEWEAR</title>

    <style>
        /*------ لون الصفحة ------*/
        body{
            background-color:#FAF5F1;
            font-family:Arial, sans-serif;
            margin:0;
            padding:0px;
        }

        /*------ العنوان ------*/
        .j{
            color:#C78FA5;
        }

        h1{
            text-align:center;
            color:#49383F;
            font-size:65px;
            letter-spacing:5px;
            margin-top:60px;
            margin-bottom:10px;
        }

        h1:hover{
            color:#C78FA5;
            transform:scale(1.03);
            transition:0.3s;

        }

        h2{
            color:#49383F;
            text-align:center;
            letter-spacing:2px;
            font-size:28px;           
            margin-top:35px ;
            margin-bottom:25px ;
            
        }

        /*------ عبارة الموقع ------*/
        .p{
            color:#9B858B;
            text-align:center;
            font-size:15px;
            letter-spacing:3px;
            line-height:1.8;
            margin-top:0;
            transition:0.3s;
        }

        .p:hover{
            color:#49383F;
        }

        /*------ الصورة الرئيسية ------*/
        .img1{
            display:block;
            width:500px;
            max-width:85%;
            height:300px;
            object-fit:cover ;           
            border-radius:5px;
            margin:40px auto;
        }

        /*------ الفواصل ------*/
        hr{
            border:none;
            height:1px;
            background-color:#EBCFD9;
            width:85%;
            margin:25px auto;
        }

        /*------ قسم المنتجات ------*/
        .productsall{
            display:flex;
            flex-direction:row;
            justify-content:center;
            align-items:center;
            flex-wrap:wrap;
            gap:25px;
            padding:20px;
        }

        /*------ بطاقة المنتج ------*/
        .products{
            width:180px;
            background-color:#F0E5E3;
            border:1px solid #EBCFD9;
            border-radius:15px;
            box-shadow:0px 4px 12px #EBCFD9;
            padding:15px;
            margin:5px;
            text-align:center;
            transition:0.3s;
        }

        .products:hover{
            transform:translateY(-8px);
            box-shadow:0px 8px 18px #D9B5C3;
        }

        .products p{
            color:#49383F;
            font-size:16px;
            margin:12px 0;
        }

        /*------ صور المنتجات ------*/
        .img{
            width:150px;
            max-width:100%;
            height:auto;
            border-radius:10px;
            transition:0.3s;
        }

        .img:hover{
            transform:scale(1.05);
        }

        /*------ الأزرار ------*/
        button{
            background-color:#C78FA5;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:25px;
            font-size:14px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background-color:#49383F;
            transform:translateY(-3px);
        }
        @media screen and (max-width:600px){

        h1{
            font-size:40px;
        }

        h2{
            font-size:24px;
        }

        .img1{
            max-width:85%;
            height:auto;
        }

        .productsall{
            flex-wrap:wrap;
         gap:15px;
        }

        .products{
            width:130px;
        }

        }

    </style>
</head>

<body>

    <h1><span class="j">JO</span> EYEWEAR</h1>

    <p class="p">stylish eyeglass designs</p>

    <img class="img1" src="https://picsum.photos/300">

    <hr>

    <h2>منتجاتنا</h2>

    <hr>

    <div class="productsall">

        <div class="products">
            <img class="img" src="https://picsum.photos/300">
            <p>JO Luna</p>
            <p>price: 150﷼</p>
            <button>اشتر الآن</button>
        </div>

        <div class="products">
            <img class="img" src="https://picsum.photos/300">
            <p>JO Nova</p>
            <p>price: 180﷼</p>
            <button>اشتر الآن</button>
        </div>

        <div class="products">
            <img class="img" src="https://picsum.photos/300">
            <p>JO Vision</p>
            <p>price: 220﷼</p>
            <button>اشتر الآن</button>
        </div>

    </div>

</body>
</html>
